name: Add package to feed

on:
  repository_dispatch:
    types: [plugin_release]

permissions:
  contents: write

jobs:
  add-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Checkout main (index scripts)
        uses: actions/checkout@v4
        with:
          ref: main
          path: _main

      - name: Update feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REPO: ${{ github.event.client_payload.repo }}
          SOURCE_TAG: ${{ github.event.client_payload.tag }}
          SOURCE_ASSET: ${{ github.event.client_payload.asset }}
        run: |
          if [ -z "$SOURCE_REPO" ] || [ -z "$SOURCE_TAG" ] || [ -z "$SOURCE_ASSET" ]; then
            echo "Missing client_payload (repo/tag/asset)." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Two dispatches landing close together (e.g. two plugins released
          # around the same time) can both start from the same gh-pages
          # commit and then race on `git push` - the loser's push is a
          # plain rejection (not a merge conflict, since each dispatch only
          # ever adds its own new ipk), so it just needs to pull the
          # winner's commit and rebuild the index again including that ipk
          # before retrying, instead of clobbering it.
          for attempt in 1 2 3 4 5; do
            gh release download "$SOURCE_TAG" --repo "$SOURCE_REPO" --pattern "$SOURCE_ASSET" --dir . --clobber
            python3 _main/scripts/gen_packages_index.py .
            gzip -kf Packages
            python3 _main/scripts/gen_index.py .

            git add -A -- . ':!_main'
            if git diff --cached --quiet; then
              echo "Nothing to commit."
              exit 0
            fi
            git commit -m "Add ${SOURCE_ASSET} from ${SOURCE_REPO}@${SOURCE_TAG}"

            if git push; then
              exit 0
            fi

            echo "Push rejected (attempt ${attempt}/5), fetching latest gh-pages and retrying..."
            git fetch origin gh-pages
            git reset --hard origin/gh-pages
            sleep "$(( (RANDOM % 5) + 1 ))"
          done

          echo "Error: could not push to gh-pages after 5 attempts." >&2
          exit 1
